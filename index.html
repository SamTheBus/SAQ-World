    <header><div><strong>SAQ WORLD</strong><span id="space-label">Starting local campaign…</span></div>
      <label>Movement <select id="control-mode"><option value="joystick">Joystick</option><option value="cursor">Cursor</option></select></label></header>
    <main><canvas id="world-view" aria-label="Alderwatch and Oldward Wood as one continuous overworld. Move with WASD, arrows, joystick or pointer."></canvas><button id="primary-attack" aria-label="Primary Attack. Tap once or hold to chain." aria-pressed="false" disabled><strong>Attack</strong><small>Space · Hold to chain</small></button>
      <section id="startup-recovery" class="world-dialog" hidden aria-live="polite"><h2 id="startup-recovery-title">World could not start</h2><p id="startup-recovery-detail"></p><div><button id="startup-retry">Retry</button><button id="startup-new">Start New Campaign</button><button id="startup-forget">Forget Saved Resume</button><button id="startup-reset" class="danger">Reset Local World Data</button></div></section></main>
    <footer><p id="world-status" role="status">Preparing the local authority…</p><button id="retry-travel" hidden>Reconcile save</button>
      <p>WASD / arrows · Drag to move · Space / Attack · Internal boundaries are seamless</p>
      <small><span id="world-metrics"></span> · <span id="control-provenance"></span></small>
      <small>Route: north from town, then east twice to Fern Hollow. Enter the clearing ring for the sword proof.</small>
      <details id="local-world-controls" hidden><summary>Local playtest data</summary><button id="start-new-campaign">Start New Campaign</button><button id="reset-local-world-data" class="danger">Reset Local World Data</button><span id="local-world-control-status" role="status"></span></details></footer>
