name: Capture actual SAQ World boss gameplay screenshots (isolated)
on:
  push:
    branches: [boss-live-capture-20261023]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact browser and bundler
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Produce temporary playable game (no source upload)
        run: npm run build:playable
      - name: Open the real World game and inspect boss-ready sites
        run: node tools/capture-boss-live-game.mjs
      - name: Keep native gameplay capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saq-world-boss-in-game-captures
          path: boss-capture-artifacts/
          if-no-files-found: warn
          retention-days: 7
