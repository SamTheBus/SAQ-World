name: Verify recovered bosses (isolated)
on:
  push:
    branches: [boss-restoration-20261023, boss-original-visuals-20261023, boss-marcus-gilded-polish-20261023, boss-archived-combat-fidelity-20261023, boss-polish-fidelity-v3-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check new boss source syntax
        run: |
          node --check src/shared/content/recovered_boss_catalog_v1.js
          node --check src/shared/contracts/recovered_boss_v1.js
          node --check src/simulation/recovered_boss_v1.js
          node --check src/client/recovered_boss_presentation_v1.js
          node --check src/shared/content/ruin_family_runtime_v1.js
          node --check src/shared/content/fort_family_runtime_v1.js
      - name: Verify recovered original Corrosive and Void Canvas renderers
        run: |
          node --check src/client/boss_archive_world_adapter_v1.js
          node --check src/client/boss_presentation_corrosive_v1.js
          node --check src/client/boss_presentation_corrosive_shedding_v2.js
          node --check src/client/boss_presentation_void_overseer_v1.js
          node --test checks/archived-boss-visuals.test.mjs
          node --check src/client/boss_archive_world_extended_v1.js
          node --check src/client/boss_presentation_chronos_arbitrator_v1.js
          node --check src/client/boss_presentation_nexus_overseer_v1.js
          node --check src/client/boss_presentation_hooktail_v1.js
          node --check src/client/boss_presentation_cinderhart_v1.js
          node --test checks/archived-boss-extended.test.mjs
      - name: Verify Marcus and Gilded original-preview visual restoration and projectile combat
        run: |
          node --check src/client/boss_presentation_treasury_v2.js
          node --test checks/treasury-boss-polish.test.mjs
      - name: Verify exact Marcus and Gilded renderer code from original playable files
        run: |
          node --check src/client/boss_presentation_marcus_the_outlaw_v1.js
          node --check src/client/boss_presentation_gilded_vault_keeper_v1.js
          node --check src/client/boss_original_treasury_world_adapter_v1.js
          node --test checks/original-treasury-painters.test.mjs
      - name: Verify source-authentic boss behaviors, attack geometry and save records
        run: |
          node --check src/shared/content/archived_boss_fight_profiles_v1.js
          node --check src/simulation/archived_boss_attack_geometry_v1.js
          node --check src/simulation/archived_boss_runtime_v1.js
          node --test checks/archived-boss-combat-parity.test.mjs
      - name: Verify original Nexus, three-leg Marcus and Corrosive shedding polish
        run: |
          node --check src/shared/content/original_nexus_ability_v1.js
          node --check src/shared/content/original_marcus_gold_rush_v1.js
          node --check src/client/boss_archive_world_adapter_v1.js
          node --test checks/boss-polish-fidelity-v3.test.mjs
      - name: Verify all eight real seeded boss site bindings and save contracts
        run: node --test checks/recovered-boss-v1.test.mjs
      - name: Replay eight boss fights for 1050 ticks with persisted state validation
        run: node --test checks/recovered-boss-combat.test.mjs
      - name: Preserve original Volcanic Ruin Brimstone
        run: node --test checks/wilderness-v4-brimstone-volcanic-ruin.test.mjs
      - name: Build playable-only bundle
        run: npm run build:playable
      - name: Verify compact playable package
        run: npm run verify:playable
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser start and worker smoke
        run: npm run smoke:playable
